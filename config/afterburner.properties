# Afterburner settings: true = on, false = off. Also in game: Options > Video Settings > Afterburner.
# Read when the game or server starts, so restart after changing this file.
# On a server only the "server and client" ones do anything. In singleplayer all of them do.

# Rendering
# face culling (client)
faceCulling=true
# translucent face culling (client)
translucentCulling=true
# leaf culling (client)
leafCulling=true
# batched chunk drawing (client)
chunkBatching=true
# smaller chunk vertices (client)
compactVertices=true
# off-screen chunk building (client)
offscreenBuilds=true
# light updates paced to a time budget (off by default: not yet checked in a real client) (client)
lightBudget=false
# occlusion culling (client)
occlusionCulling=true
# entity culling (client)
entityCulling=true
# visible-only animations (client)
visibleAnimations=true
# faster biome blending (client)
fastBiomeBlend=true
# bigger smooth lighting cache (client)
smoothLightCache=true
# faster visibility updates (client)
fastVisibility=true
# faster particles (client)
fastParticles=true

# World and server
# faster surface layer (server and client)
fastSurface=true
# cached biome zoom (off by default: exact, gain not clearly measurable) (server and client)
biomeZoomCache=false
# fewer surface rule checks (server and client)
surfaceReach=true

# Network
# accurate ping (server and client)
accuratePing=true

# World and server
# rebuild damaged region file entries (off by default: switch on for a broken world) (server and client)
regionRepair=false
# plain random numbers (server and client)
plainRandom=true
# kept mob count for spawning (off by default: no measured gain) (server and client)
spawnCensus=false
# faster inventory advancement checks (server and client)
fastInventoryTrigger=false

# Memory
# memory trim (client)
memoryTrim=true

# World and server
# parallel worldgen (server and client)
parallelWorldgen=true
# faster lighting (server and client)
fastLight=true
# cheaper light queue (server and client)
fastLightQueue=true
# cheaper light snapshots (server and client)
lightSnapshots=true
# skip saving unchanged player files (server and client)
skipUnchangedSaves=false
# faster collisions (server and client)
fastCollisions=true
# faster entity searches (server and client)
fastEntitySearch=true
# faster chunk ticks (server and client)
fastChunkTicks=true
# cheaper precipitation tries (server and client)
fastPrecipitation=true
# faster mob AI (server and client)
fastMobAi=true
# cheaper mob ticks (server and client)
fastMobTicks=true
# faster hoppers (server and client)
fastHoppers=true
# faster mob spawning (server and client)
fastSpawning=true
# lazy nearby-mob sorting (off by default: no measured gain) (server and client)
lazyNearestSort=false
# faster structure layout (server and client)
fastStructures=true
# faster ore placement (server and client)
fastOres=true
# cheaper aquifers (server and client)
fastAquifer=true
# faster biome search (server and client)
fastBiomeSearch=true
# parked scheduled ticks (server and client)
parkedTicks=true
# cheaper climbing, in-wall and push checks (server and client)
entityChecks=true
# sleeping idle furnaces (server and client)
idleBlockEntities=true
# faster block entity cleanup (server and client)
tickerCleanup=true
# sleeping idle hoppers (server and client)
idleHoppers=true
# faster explosions (server and client)
fastExplosions=true
# resting primed TNT remembers its collision answer (off by default) (server and client)
restingTnt=false
# faster redstone dust (server and client)
fastRedstone=true
# redstone dust memo ignores changes far from the dust (server and client)
wireMemoNear=true
# comparators read their input once (server and client)
comparatorRead=true
# containers skip the comparator look-around when there is none (off by default: no gain) (server and client)
outputSignalSkip=false
# redstone dust remembers its power until something around it changes (server and client)
wireMemo=true
# faster water and lava flow (server and client)
fastFluids=true
# hopper container cache (server and client)
hopperCache=true
# faster pathfinding (server and client)
fastPathfinding=true
# off-thread structure search (server and client)
asyncStructureSearch=true
# cheaper entity tracking (server and client)
fastTracking=true
# cheaper item merging (server and client)
fastItemMerge=true
# slower AI for mobs far from players (off by default: changes how they act) (server and client)
farMobAi=false
# dropped items by dimension: lifetime and merge range (off by default: changes how long items last) (server and client)
dimensionItems=false
# cheaper packet compression (server and client)
fastCompression=true
# shared chunk packets (server and client)
sharedChunkPackets=true
# shared chunk packet compression (server and client)
sharedChunkCompression=true
# shared multi-player packet compression (server and client)
sharedBroadcast=true
# pack packets without a copy (server and client)
packNoCopy=true
# let go of unused structure pieces (off by default: pays off with structure mods) (server and client)
idleTemplates=false
# hoppers see full chests (server and client)
forgeHoppers=true
# skip events no mod listens to (server and client)
quietEvents=true
# shared block shapes (server and client)
sharedShapes=true
# leaner chunk sections (server and client)
leanSections=true
# leaner block states (server and client)
leanStates=true
# smaller view for slow connections (server and client)
slowLinks=true
# send chunks in front of the player first (server and client)
chunkOrder=true
# pace chunks for slow connections by what is still unsent (server and client)
slowLinkPacing=true
# fewer server particles for slow connections (off by default: fewer effects) (server and client)
slowParticles=false

# Network
# leave heightmaps out of link chunks (off by default: not tried with a real game yet) (server and client)
linkHeightmaps=false

# World and server
# per-player network meter (/afterburner net) (server and client)
netMeter=true

# Network
# leave unchanged light out of light packets (server and client)
lightResend=false
# skip rebuilds for repeated light (off by default: not tried in a real game yet) (server and client)
lightSameSkip=false
# shared entity packet compression (off by default: no measured gain) (server and client)
sharedEntityPackets=false
# cached registry sync on join (server and client)
registrySyncCache=true
# skip re-hashing cached server packs (off by default: not byte-proof) (server and client)
packHashSidecar=false

# World and server
# reused region file compressor (server and client)
regionDeflateReuse=true
# cheaper region file compression (off by default: bigger world files) (server and client)
fastRegionDeflate=false

# Other
# lower worker priority (client)
workerPriority=true
# lower frame rate behind other windows (client)
unfocusedFps=true

# Network
# act on clicks at once (server and client)
inputAtPress=true
# smaller chunks between Afterburner games and servers (slow connections) (server and client)
chunkLink=false
# keep chunks from Afterburner servers for next time (server and client)
chunkCache=true
# keep chunks by section, so a changed chunk costs little (server and client)
chunkSections=false
